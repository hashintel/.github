# Centralized Renovate workflow
#
# Reusable workflow that runs Renovate with a centrally pinned version, and with
# an installation token minted from a key that only Vault can use.
name: Update dependencies

on:
  pull_request:
    paths:
      - ".github/workflows/housekeeping-dependencies.yml"
      - ".github/actions/install-renovate/**"
      - ".github/actions/github-app-token/**"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      repoCache:
        description: "Reset or disable the cache?"
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset
      logLevel:
        description: "Override default log level"
        type: choice
        default: info
        options:
          - "debug"
          - "info"
          - "warn"
          - "error"
      overrideSchedule:
        description: "Override all schedules"
        type: boolean
        default: false
      dryRun:
        description: "Dry run mode"
        type: choice
        default: disabled
        options:
          - disabled
          - extract
          - lookup
          - full
  workflow_call:
    inputs:
      repoCache:
        description: "Reset or disable the cache?"
        type: string
        default: enabled
      logLevel:
        description: "Override default log level"
        type: string
        default: info
      overrideSchedule:
        description: "Override all schedules"
        type: boolean
        default: false
      dryRun:
        description: "Dry run mode"
        type: string
        default: disabled
    secrets:
      CF_ACCESS_STAGE_CLIENT_SECRET:
        description: >-
          Cloudflare Access service token for the staging Vault. A called
          workflow does not inherit secrets the way it resolves `vars`, and
          SRE-901 removed `secrets: inherit` from the callers, so each one passes
          this explicitly. A caller that forgets fails at dispatch rather than on
          a Cloudflare rejection.
        required: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    concurrency:
      cancel-in-progress: false
      group: renovate
    env:
      is_pr: ${{ github.event_name == 'pull_request' }}
      dry_run: ${{ github.event_name == 'pull_request' && 'extract' || inputs.dryRun || 'disabled' }}
      repo_cache: ${{ inputs.repoCache || 'enabled' }}

    steps:
      - name: Get token
        id: app-token
        uses: $/.github/actions/github-app-token
        with:
          vault-address: ${{ vars.VAULT_STAGE_ADDR }}
          vault-role: ci-renovate
          app-id: "991899"
          transit-key: github-app-hash-worker
          repository: ${{ github.repository }}
          cf-access-client-id: ${{ vars.CF_ACCESS_STAGE_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_STAGE_CLIENT_SECRET }}

      - name: Install Renovate
        uses: $/.github/actions/install-renovate

      - name: Download renovate cache
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        if: env.is_pr != 'true' && env.repo_cache != 'disabled'
        continue-on-error: true
        with:
          name: renovate-cache
          path: cache-download

      - name: Extract renovate cache
        if: env.is_pr != 'true' && env.repo_cache != 'disabled'
        run: |
          if [ ! -d cache-download ]; then
            echo "No cache found."
            exit 0
          fi

          mkdir -p /tmp/renovate/cache/renovate/repository
          tar -xzf cache-download/renovate_cache.tar.gz -C /tmp/renovate/cache/renovate/repository

      - name: Run Renovate
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_FORCE: ${{ inputs.overrideSchedule && '{"schedule":null}' || '' }}
          RENOVATE_DRY_RUN: ${{ env.dry_run == 'disabled' && 'null' || env.dry_run }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REPOSITORY_CACHE: ${{ env.repo_cache }}
          RENOVATE_ALLOW_SCRIPTS: "false"
          RENOVATE_IGNORE_SCRIPTS: "true"
        run: renovate

      - name: Compress renovate cache
        if: env.is_pr != 'true' && env.dry_run == 'disabled' && env.repo_cache != 'disabled'
        run: tar -czvf renovate_cache.tar.gz -C /tmp/renovate/cache/renovate/repository .

      - name: Upload renovate cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.is_pr != 'true' && env.dry_run == 'disabled' && env.repo_cache != 'disabled'
        with:
          name: renovate-cache
          path: renovate_cache.tar.gz
          retention-days: 1
